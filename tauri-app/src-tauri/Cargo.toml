[package]
name = "wizgold-patcher-tauri"
version = "1.0.0"
edition = "2021"
description = "Wizardry Gold Patcher (Tauri) - roll + game-speed patches."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
