[package]
name = "wizgold_highroll_gui"
version = "1.0.0"
edition = "2021"
description = "One-click GUI to patch Wizardry Gold for high character-creation rolls."

[dependencies]
eframe = "0.27"

# Optimize the release build for a small standalone exe.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
